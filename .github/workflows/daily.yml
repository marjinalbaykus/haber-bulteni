name: Günlük bülten (DeepSeek, elle)

# Günlük bülteni artık her akşam 21:00 Claude rutini hazırlıyor (bkz. publish.yml).
# Bu iş akışı yedek: uygulamada Ayarlar > "Bülteni şimdi hazırla" veya Actions sekmesinden elle çalıştırılır,
# DeepSeek ile bülten üretir (ücretli, yaklaşık 0,08 dolar). date verilirse o günün bülteni hazırlanır.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Bülten günü (YYYY-AA-GG), boşsa bugün"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: bulten-yazma
  cancel-in-progress: false

jobs:
  bulten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Bülteni hazırla
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BULTEN_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$BULTEN_DATE" ]; then python -m bulten daily --date "$BULTEN_DATE"; else python -m bulten daily; fi

      - name: Kaydet ve siteyi güncelle
        run: bash scripts/commit_push.sh "Bülten (DeepSeek, elle) ${BULTEN_DATE:-$(date -u +%F)}"
        env:
          BULTEN_DATE: ${{ inputs.date }}
