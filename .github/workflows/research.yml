name: Araştırma (uygulamadan)

# Telefon uygulamasındaki "Ara" ekranı bu iş akışını GitHub API ile başlatır.
# DeepSeek kullanır (bir araştırma yaklaşık $0,005). Sonuç data/research/ altına yazılır ve siteye eklenir.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Araştırılacak konu"
        required: true
        type: string

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: bulten-yazma
      cancel-in-progress: false
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      QUERY: ${{ inputs.query }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Araştır
        run: python -m bulten research "$QUERY"
      - name: Kaydet ve siteyi güncelle
        run: bash scripts/commit_push.sh "Araştırma (uygulama) $(date -u +%F_%H%M)"
      - name: Telegram'a da gönder
        continue-on-error: true
        run: |
          if [ -f .pending/notify.json ]; then sleep 60; python -m bulten notify; fi
