name: Bülteni yayınla

# Claude rutini her akşam 21:00 (TR) data/bulletins/<tarih>.json dosyasını main'e gönderir.
# Bu iş akışı siteyi (docs/ ve api/) üretir. (GitHub Actions'ın kendi push'ları bunu tetiklemez.)
on:
  push:
    branches: [main]
    paths: ["data/bulletins/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bulten-yazma
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Siteyi güncelle
        run: |
          bash scripts/commit_push.sh "Site - $(date -u +%F) bülteni"
